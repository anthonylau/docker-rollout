version: '3.8'

services:
  web:
    build:
      context: .
      args:
        VERSION: ${VERSION:-v1}
    image: docker-rollout-test:${VERSION:-v1}
    # Don't use container_name or ports as they conflict with multiple instances
    labels:
      - "test.version=${VERSION:-v1}"
    environment:
      - APP_VERSION=${VERSION:-v1}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 1s
    deploy:
      replicas: 2
